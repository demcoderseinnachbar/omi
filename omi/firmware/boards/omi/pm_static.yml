app:
  address: 0xf200
  end_address: 0x100000
  region: flash_primary
  size: 0xefe00
external_flash:
  address: 0x130000
  end_address: 0x200000
  region: external_flash
  size: 0xd0000
# Pinned, and the addresses are a compatibility contract rather than a layout
# preference. See SHARD_RELEASES.md.
#
# Upstream leaves both of these to the partition manager with the same
# constraint — `before: [tfm_storage, end]` — and no ordering between them, so
# two placements are equally valid and which one appears depends on the order
# the fragments happen to be collected in. That is not a theoretical concern: a
# Shard already in the field was built with settings first, and a later build of
# the same source produced them the other way round.
#
# A firmware update writes only the application slot. If these addresses move,
# the new firmware looks for its settings where nothing wrote them — the device
# silently loses its clock, its microphone gain and its dim ratio. There is no
# cable to this hardware and no way to put them back.
#
# So the values below are the ones already on shipped hardware, not the ones a
# fresh build happens to choose. `littlefs_storage` is pinned too even though
# nothing mounts it: its placement decides where `settings_storage` lands.
#
# Moving either of these needs a planned storage migration and a product
# decision, not a rebuild.
littlefs_storage:
  address: 0xfa000
  end_address: 0x100000
  region: flash_primary
  size: 0x6000
mcuboot:
  address: 0x0
  end_address: 0x10000
  placement:
    align:
      end: 0x1000
    before:
    - mcuboot_primary
  region: flash_primary
  size: 0x10000
mcuboot_pad:
  address: 0x10000
  end_address: 0x10200
  placement:
    align:
      start: 0x4000
    before:
    - mcuboot_primary_app
  region: flash_primary
  size: 0x200
mcuboot_primary:
  address: 0x10000
  end_address: 0x100000
  orig_span: &id001
  - mcuboot_pad
  - app
  region: flash_primary
  size: 0xf0000
  span: *id001
mcuboot_primary_1:
  address: 0x0
  device: nordic_ram_flash_controller
  end_address: 0x40000
  region: ram_flash
  size: 0x40000
mcuboot_primary_app:
  address: 0x10200
  end_address: 0x100000
  orig_span: &id002
  - app
  region: flash_primary
  size: 0xefe00
  span: *id002
mcuboot_secondary:
  address: 0x0
  device: DT_CHOSEN(nordic_pm_ext_flash)
  end_address: 0xf0000
  placement:
    align:
      start: 0x4
  region: external_flash
  share_size:
  - mcuboot_primary
  size: 0xf0000
mcuboot_secondary_1:
  address: 0xf0000
  device: DT_CHOSEN(nordic_pm_ext_flash)
  end_address: 0x130000
  region: external_flash
  size: 0x40000
otp:
  address: 0xff8100
  end_address: 0xff83fc
  region: otp
  size: 0x2fc
pcd_sram:
  address: 0x20000000
  end_address: 0x20002000
  placement:
    after:
    - start
  region: sram_primary
  size: 0x2000
ram_flash:
  address: 0x40000
  end_address: 0x40000
  region: ram_flash
  size: 0x0
rpmsg_nrf53_sram:
  address: 0x20070000
  end_address: 0x20080000
  placement:
    before:
    - end
  region: sram_primary
  size: 0x10000
settings_storage:
  address: 0xf8000
  end_address: 0xfa000
  region: flash_primary
  size: 0x2000
sram_primary:
  address: 0x20002000
  end_address: 0x20070000
  region: sram_primary
  size: 0x6e000
