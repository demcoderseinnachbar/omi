# Enough kernel to run the real thing, and nothing more.
#
# The point of this suite is that `k_work_reschedule`, `k_spinlock` and
# `k_uptime_ticks` are Zephyr's own rather than stand-ins, so the rule is proved
# against the scheduler the firmware actually runs on.
CONFIG_ZTEST=y

CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y

# haptic.c registers a GATT service at file scope, so the Bluetooth host has to
# link. `bt_enable()` is never called and no radio is needed: native_sim's HCI
# is a user-channel socket that stays closed.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
