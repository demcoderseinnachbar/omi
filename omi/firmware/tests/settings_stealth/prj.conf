# Enough of the settings subsystem to run the real thing, and nothing more.
#
# The backend is the test's own (`settings_backend_init()` in src/main.c): it
# keeps records in memory and counts every save. That is what makes "nothing is
# written" an observation rather than an assumption -- an emulated flash could
# only be inspected after the fact, and only for what it happens to show.
CONFIG_ZTEST=y

CONFIG_SETTINGS=y
CONFIG_SETTINGS_CUSTOM=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
